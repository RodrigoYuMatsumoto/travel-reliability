name: Reproducible bug
description: Report a problem with synthetic data only.
body:
  - type: markdown
    attributes:
      value: 'Do not upload real travel documents, identifiers, secrets or personal data. Security issues: see SECURITY.md.'
  - type: textarea
    id: behavior
    attributes: { label: Expected and actual behavior }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Minimal synthetic reproduction }
    validations: { required: true }
  - type: input
    id: version
    attributes: { label: Version and environment }
    validations: { required: true }
