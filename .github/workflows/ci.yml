name: Verify contracts and evidence boundaries
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: travel_test
          POSTGRES_PASSWORD: synthetic-database-only
          POSTGRES_DB: travel_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U travel_test -d travel_test" --health-interval 5s --health-retries 12
      redis:
        image: redis:7-bookworm
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 24, cache: npm }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: 0.11.32, python-version: '3.12' }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-por tesseract-ocr-eng
      - run: npm ci
      - run: uv sync --project ingest --locked
      - run: npm run format:check && npm run lint:python
      - name: Audit Python runtime dependencies
        run: |
          uv export --project ingest --locked --format requirements-txt --no-dev --output-file /tmp/travel-runtime.txt --quiet
          uvx pip-audit==2.10.1 --requirement /tmp/travel-runtime.txt --no-deps --disable-pip
      - name: Start disposable S3-compatible test service
        run: docker run -d --name travel-test-s3 -p 127.0.0.1:9000:8333 -e AWS_ACCESS_KEY_ID=synthetic-access -e AWS_SECRET_ACCESS_KEY=synthetic-secret-only chrislusf/seaweedfs:4.51@sha256:f7a49e3f3972ebed5be2ed4befa4a0c68eb7bdddba6e692d42729ceb545134b8 mini -dir=/data
      - name: Wait for test object storage
        run: node scripts/wait-test-store.mjs
      - run: npm run check
        env:
          TEST_DATABASE_URL: postgresql://travel_test:synthetic-database-only@127.0.0.1:5432/travel_test
          TEST_REDIS_URL: redis://127.0.0.1:6379
          TEST_S3_ENDPOINT: http://127.0.0.1:9000
          REQUIRE_NATIVE_OCR: '1'
      - name: Generated public contracts stay in sync
        run: npm run schema:types && npm run contracts:generate && git diff --exit-code -- schema api/openapi.json examples
      - run: npm run privacy:history
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t travel-reliability:test . && docker build -t travel-ingest:test ingest
      - run: npm run sbom
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: verification-artifacts
          path: |
            playwright-report/
            sbom.cdx.json
          retention-days: 7
