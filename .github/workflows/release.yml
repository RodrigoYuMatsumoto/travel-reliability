name: Verify published release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to download and verify (v0.6.0 or later)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: published-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  verify-release:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_REPO: RodrigoYuMatsumoto/travel-reliability
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate stable tag before checkout or shell interpolation
        id: identity
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              raise SystemExit('INVALID_RELEASE_TAG')
          version = tuple(map(int, tag[1:].split('.')))
          if version < (0, 6, 0):
              raise SystemExit('LEGACY_RELEASE_FORMAT_NOT_SUPPORTED')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f'tag={tag}\nversion={tag[1:]}\n')
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.identity.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with: { version: 0.11.32, python-version: '3.12' }
      - name: Download exactly the published assets and verify their records
        shell: bash
        env:
          EXPECTED_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          bundle_dir="$RUNNER_TEMP/published-release-assets"
          metadata_file="$RUNNER_TEMP/published-release-metadata.json"
          mkdir "$bundle_dir"
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir "$bundle_dir"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$metadata_file"
          expected_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          uv run --no-project --python 3.12 python scripts/release-bundle.py verify \
            --directory "$bundle_dir" \
            --expected-version "$EXPECTED_VERSION" \
            --expected-commit "$expected_commit" \
            --source-tree-repository "$GITHUB_WORKSPACE" \
            --require-stable \
            --github-release-metadata "$metadata_file" \
            > "$RUNNER_TEMP/published-release-verification.json"
          cat "$RUNNER_TEMP/published-release-verification.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: published-release-verification
          path: ${{ runner.temp }}/published-release-verification.json
          if-no-files-found: error
