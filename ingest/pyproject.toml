[project]
name = "travel-reliability-ingest"
version = "0.1.0"
description = "Isolated, bounded document extraction for Travel Reliability"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pypdf>=6,<7",
  "pypdfium2>=5,<6", "pillow>=13,<14", "pytesseract>=0.3.13,<1",
  "defusedxml>=0.7.1,<1", "beautifulsoup4>=4.13,<5"
]
[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
pythonpath = ["."]
[tool.ruff]
target-version = "py312"
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.uv]
link-mode = "copy"
